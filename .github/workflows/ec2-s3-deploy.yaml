name: Deploy Infrastructure on AWS

on:
  push:
    branches:
      - main
      - master
      - test

jobs:

  plan:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment:
          - dev
          - prod

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: Terraform Plan S3
        working-directory: environ/${{ matrix.environment }}/s3
        run: |
          terragrunt init
          terragrunt validate
          terragrunt plan -out=tfplan

      - name: Terraform Plan EC2
        working-directory: environ/${{ matrix.environment }}/ec2
        run: |
          terragrunt init
          terragrunt validate
          terragrunt plan -out=tfplan

  apply:

    needs: plan

    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment:
          - dev
          - prod

    environment:
      name: ${{ matrix.environment }}-approval

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: Apply S3
        working-directory: environ/${{ matrix.environment }}/s3
        run: |
          terragrunt init
          terragrunt apply -auto-approve

      - name: Apply EC2
        working-directory: environ/${{ matrix.environment }}/ec2
        run: |
          terragrunt init
          terragrunt apply -auto-approve