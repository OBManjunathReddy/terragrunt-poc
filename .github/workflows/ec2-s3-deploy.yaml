name: Deploy Infrastructure

on:
  workflow_dispatch:

    inputs:

      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: Deploy S3
        working-directory: environ/${{ github.event.inputs.environment }}/s3
        run: |
          terragrunt init
          terragrunt apply -auto-approve

      - name: Deploy EC2
        working-directory: environ/${{ github.event.inputs.environment }}/ec2
        run: |
          terragrunt init
          terragrunt apply -auto-approve